name: People dataset (mentorship, events, management)

# Reads every people source in config/people.yml, normalizes emails and phones, flags anomalies
# (dummy rows, invalid emails, broken phones, out-of-range years), merges records of the same
# person by normalized email, and sends uncertain matches to a review queue. Rows go to the
# lakehouse (people/*.parquet) and the PEOPLE sheet in the Shared Drive; the site only gets
# encrypted aggregates (people.json).

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/people.yml
      - config/places.yml
      - pipeline/people.py
      - pipeline/people_gold.py
      - pipeline/people_build.py
      - pipeline/sources.py
      - pipeline/seal.py
      - tests/fixtures/people/**
      - tests/test_people.py
      - .github/workflows/people.yml

permissions:
  contents: read
  pages: write
  id-token: write

# Shares the Pages group with pipeline.yml: the two deploys never overlap, and each carries the
# other's files forward.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest==8.3.4
      - run: pytest -q tests/test_people.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Check secrets
        env:
          SITE_PIN: ${{ secrets.SITE_PIN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ "$SITE_PIN" =~ ^[0-9]{12}$ ]] || { echo "::error::Secret SITE_PIN must be exactly 12 digits"; exit 1; }
          [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || echo "::warning::GOOGLE_SERVICE_ACCOUNT_JSON is not set; the run will be recorded as failed"

      # A Pages deploy replaces the whole site: start from everything that is live now.
      - name: Fetch currently published data
        id: pages
        uses: actions/configure-pages@v5
      - name: Download published data
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p previous site/data
          for f in catalog jobs governance dashboard knowledge people people_directory; do
            curl -fsSL "$BASE/data/$f.json" -o "previous/$f.json" || rm -f "previous/$f.json"
          done
          ls -la previous
          missing=0
          for f in catalog jobs governance dashboard; do [ -f "previous/$f.json" ] || missing=1; done
          if [ "$missing" = 1 ]; then
            echo "::error::The main pipeline has not published yet; run 'Pipeline (Sheets to DuckDB to Pages)' first so this deploy doesn't remove its pages."
            exit 1
          fi
          cp previous/*.json site/data/
          rm -f site/data/people.json

      - name: Run people job
        id: run
        continue-on-error: true
        env:
          SITE_PIN: ${{ secrets.SITE_PIN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PREVIOUS_DIR: previous
        run: python pipeline/people_build.py

      # Row-level data stays in the Shared Drive; nothing local is uploaded.
      - name: Remove local data
        if: always()
        run: rm -rf build previous

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Report failure
        id: report
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::People job failed; the site keeps the last good aggregates. See the 'Run people job' step."
          echo "failed=true" >> "$GITHUB_OUTPUT"
    outputs:
      failed: ${{ steps.report.outputs.failed }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Fail if the people job failed
        if: needs.build.outputs.failed == 'true'
        run: exit 1
