name: Query (lakehouse to preview sheet)

# Runs one read-only SQL query on the lakehouse and writes the result to a Google Sheet in the
# Shared Drive's previews/ folder. Previews are deleted after outputs.preview_retention_hours
# (config/platform.yml); the schedule below removes expired ones even when nobody queries.
run-name: ${{ github.event_name == 'schedule' && 'Delete expired previews' || format('Query · {0}', inputs.label || 'preview') }}

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "One SELECT on bronze.*, silver.*, gold.* (DuckDB SQL)"
        required: true
      label:
        description: "Short name for the preview sheet"
        required: false
        default: ""
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: query-${{ github.run_id }}

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run query
        if: github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          QUERY_SQL: ${{ inputs.sql }}
          QUERY_LABEL: ${{ inputs.label }}
        run: python pipeline/query.py
      - name: Delete expired previews
        if: github.event_name == 'schedule'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python pipeline/query.py --cleanup-only
