# People dataset: one row per person across management, events and mentorship (PhD and master).
#
# Labels and lifecycle stages follow the team glossary "[Data-020] Extracted Metadata from Pilot
# Governed Dataset Lifecycle" and the people data lifecycle diagrams (DEV/Data-022). The glossary
# has no Master domain yet: MASTER_MENTOR / MASTER_MENTEE mirror the PhD labels until it does.
#
# Dedup rule (1-1 notes, 3 Jul 2026, and the 2025 duplicates report): the normalized email is the
# person key. Rows that only share a phone number or a name are NOT merged automatically; they go
# to the review queue for a person to decide (one person with two addresses).

people:
  min_year: 2015
  # Activity output keeps only one row per person, label, year and status.
  # Columns read from every source when present (first matching header wins, case-insensitive).
  columns:
    email: [email, email address, email_address]
    full_name: [full_name, full name, name]
    phone: [phone, whatsapp phone number, phone_number_whatsapp, whatsapp_phone_number]
    year: [batch, year]
    linkedin: [linkedin, linked_in]
    birthday: [birthday, date of birth, date_of_birth]

  # Profile fields for the people gold table (pipeline/people_gold.py). The newest non-empty answer of a
  # person wins. Places are matched to city / province / island region / country with config/places.yml.
  attributes:
    residence_city: [current_residence, "your current residency (city/ regency)", your_current_residency_city_regency, current residence]
    residence_province: ["your current residency (region)", your_current_residency_province]
    residence_country: [country_of_residency]
    birth_place: [place_of_birth, place of birth]
    bachelor_institution: [bachelor_institution, "bachelor's degree - name of institution", bachelors_degree_name_of_institution]
    master_institution: [master_institution, "master's degree - name of institution", masters_degree_name_of_institution]
    master_country: [master_country, "master's degree - country", masters_degree_country]
    doctoral_institution: [doctoral_institution, doctoral_degree_name_of_institution]
    doctoral_country: [doctoral_coutry, doctoral_country, doctoral_degree_country]
    target_country: [application_1_country, target country, preferred_country_of_study]
    target_university: [application_1_university, target university/ institution, preferred_university_or_institution_1]
    area_of_study: [doctoral_degree_areas_of_study, phd_area_of_study, master_area_of_study, "master's degree - area of study", area_of_study, bachelor_area_of_study]
    occupation_institution: ["current occupation - institution", current_occupation_institution, work_experience_name_of_institution]

  sources:
    # ---------------- Master mentorship (the regular IM Mentorship) ----------------
    - key: all_time_mentee
      title: "[DB] All Time Mentorship Profiling · Mentee"
      spreadsheet_id: 1nHoX0NFpKD4XIthfgCQ9LU5GFb4B07WpX8UMLlCWfbs
      tab: Mentee
      label: MASTER_MENTEE
      selected_column: is_selected_mentee
    - key: all_time_mentor
      title: "[DB] All Time Mentorship Profiling · Mentor"
      spreadsheet_id: 1nHoX0NFpKD4XIthfgCQ9LU5GFb4B07WpX8UMLlCWfbs
      tab: Mentor
      label: MASTER_MENTOR
      selected_column: is_selected_mentor
    - key: mentee_new_2025
      title: "Mentee_new_2025 · new consolidated"
      spreadsheet_id: 1ShgeE1rjP6fIudaj-wYTvcO0mF7f7mzsy-wC33Az2zA
      tab: new consolidated
      label: MASTER_MENTEE
      selected_column: is_selected_mentee
    - key: mentor_new_2025
      title: "Mentor_new_2025 · new consolidated"
      spreadsheet_id: 1dDBuylmf6EgZgiN2Z24X6BXiJF5jIDMWTfXcGj2y2Y8
      tab: new consolidated
      label: MASTER_MENTOR
      selected_column: is_selected_mentor
    - key: mentee_2024
      title: "Mentee_2024"
      spreadsheet_id: 1VRdPrO-OPxSPKtaeuVEXfse-mEZha_F74-dAKLbaIB8
      tab: Sheet1
      label: MASTER_MENTEE
      selected_column: is_selected_mentee
    - key: mentor_legacy_2024
      title: "mentor_legacy_2024"
      spreadsheet_id: 1QNllf5nhFPagSc5Q_TGOpNvNaGn5P-YpdA3dur1_1yA
