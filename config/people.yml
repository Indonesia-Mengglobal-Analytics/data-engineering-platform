    # ---------------- PhD mentorship (earlier: PhD Bootcamp) ----------------
    - key: pdb_phd_mentee
      title: "Participant Database · PhD_mentee (PhD Bootcamp registrations)"
      spreadsheet_id: 1W8VrZeyT1HKyZ1KQqI6tVOfw08WZ6-8zZ0eCO_eagFM
      tab: PhD_mentee
      label: PHD_MENTEE
      status: CANDIDATE
    - key: phd_bootcamp_participant
      title: "phd bootcamp · final_participant"
      spreadsheet_id: 1jvWpB1M7uE18wRh0szgqimQptLI1AMqv2f66D_zR4zw
      tab: final_participant
      label: PHD_MENTEE
      status: SELECTED
      year: 2024
      # Bootcamp lists: university and country are where the participant wants to do the PhD.
      attributes: {target_university: [university], target_country: [country]}
    - key: phd_bootcamp_coach
