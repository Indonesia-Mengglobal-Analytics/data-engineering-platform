      spreadsheet_id: 1jvWpB1M7uE18wRh0szgqimQptLI1AMqv2f66D_zR4zw
      tab: final_coach
      label: PHD_MENTOR
      status: SELECTED
      year: 2024
      # Coaches: university and country of their PhD.
