    # ---------------- Events ----------------
    - key: pdb_event_participants
      title: "Participant Database · event_participants"
      spreadsheet_id: 1W8VrZeyT1HKyZ1KQqI6tVOfw08WZ6-8zZ0eCO_eagFM
      tab: event_participants
      year_column: event_date
      event_column: event_name
      # event_role value -> label and stage (anything else counts as a participant)
      role_column: event_role
      roles:
        participant: {label: EVENT_PARTICIPANT, status: REGISTERED}
        speaker: {label: EVENT_SPEAKER, status: CONFIRMED}
        panelist: {label: EVENT_SPEAKER, status: CONFIRMED}
        moderator: {label: EVENT_SPEAKER, status: CONFIRMED}
        keynote speaker: {label: EVENT_SPEAKER, status: CONFIRMED}
        management: {label: EVENT_COMMITTEE, status: CONFIRMED}
      label: EVENT_PARTICIPANT
      status: REGISTERED

    # ---------------- Management ----------------
    - key: mgmt_accepted
      title: "[RAW] IM Management Team 2020 - 2025 · Accepted"
      spreadsheet_id: 1XU3OVciel1WwKxwEQGj14X2J0Faxnw-wKRRTF7n6Rwc
      tab: Accepted
      header_row: 2
      label: MANAGEMENT_MEMBER
      status: ACTIVE
    - key: mgmt_applied
      title: "[RAW] IM Management Team 2020 - 2025 · Applied"
      spreadsheet_id: 1XU3OVciel1WwKxwEQGj14X2J0Faxnw-wKRRTF7n6Rwc
      tab: Applied
      header_row: 2
