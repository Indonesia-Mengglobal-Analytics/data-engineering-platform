      status: APPLIED
    - key: mgmt_recruitment
      title: "[RAW] IM Management Recruitment · ALL"
      spreadsheet_id: 1I_5LpW_uq3hkDhbo-wxv8jex6GJnj0b63dWl0UAeCc8
      tab: ALL
      label: MANAGEMENT_CANDIDATE
      status: APPLIED
    - key: mgmt_selected
      title: "[RAW] IM Management Team - SELECTED"
      spreadsheet_id: 14957JP6j5OBdFC5rIorWzK31UuQSnmF3d1Lx2rLbXX0
      tab: Sheet1
      label: MANAGEMENT_MEMBER
      status: SELECTED

  # Mentor-mentee pairs (people gold: mentees_mentored, mentors_had, and MENTORED edges in the graph).
  # Each side is matched to a person by email, else a phone found once, else an exact name held by
  # exactly one person with that role; the link records which (column "match").
  pairings:
    - key: phd_bootcamp_pairs
      title: "phd bootcamp · final result"
      spreadsheet_id: 1jvWpB1M7uE18wRh0szgqimQptLI1AMqv2f66D_zR4zw
      tab: final result
      program: PHD
      year: 2024
      group_column: group_name
      mentor_columns: {email: [mentor_email], name: [mentor_name]}
      mentee_columns: {email: [mentee_email], name: [mentee_name]}
    - key: master_pairing
      title: "mentee mentor pairing · final_pairing"
      spreadsheet_id: 1Z-lly28ZecwG3Qbs5oz5YRSyx-jfIUZQbzchmjd-UEg
      tab: final_pairing
      program: MASTER
      year: 2024   # sheet created July 2024; confirm the batch with the mentorship team
      # Pairs hold ids only; the raw tabs give each id's name (and the mentor's phone).
      mentor_columns: {id: [mentor_id]}
      mentee_columns: {id: [mentee_id]}
      lookups:
        mentor: {tab: raw mentor, id: id, name: Full Name, phone: Phone number (WhatsApp)}
        mentee: {tab: raw mentee, id: id, name: Full Name}

  # Known but not used, and why (shown on the People page).
  not_used:
    - {title: "keynote_speakers.csv", reason: "Only a phone column: no email or name to identify a person"}
    - {title: "Participant Database · web_form_responses", reason: "Interest to contribute (mentor, speaker, writer), not a role yet; no glossary label"}
    - {title: "Indonesia Mengglobal - Filtered People View (5 copies)", reason: "Earlier output of this dataset, not a source"}

  labels:
    PHD_MENTEE: {domain: PhD Mentorship, education_level: PhD, role: mentee}
    PHD_MENTOR: {domain: PhD Mentorship, education_level: PhD, role: mentor}
    MASTER_MENTEE: {domain: Master Mentorship, education_level: Master, role: mentee}
    MASTER_MENTOR: {domain: Master Mentorship, education_level: Master, role: mentor}
    EVENT_PARTICIPANT: {domain: Event, education_level: "", role: participant}
    EVENT_SPEAKER: {domain: Event, education_level: "", role: speaker}
    EVENT_COMMITTEE: {domain: Event, education_level: "", role: committee}
    MANAGEMENT_CANDIDATE: {domain: Management, education_level: "", role: candidate}
    MANAGEMENT_MEMBER: {domain: Management, education_level: "", role: member}
