    - key: phd_mentee_2026
      title: "Mentee_Data_PhD_Mentorship_2026"
      spreadsheet_id: 1LpvKvoXsVdYsUqtYHXK1GEubUw9uykE1RTIs2bHJaLI
      tab: DATA
      header_from_column_metadata: true
      label: PHD_MENTEE
      status: CANDIDATE
      year: 2026
    - key: phd_mentor_2026
      title: "Mentor_Data_PhD_Mentorship_2026"
      spreadsheet_id: 1hUpoba7UJ0qQgX10GWsYlNewfVILi44YgULhLHSM-wc
      tab: DATA
      header_from_column_metadata: true
      label: PHD_MENTOR
