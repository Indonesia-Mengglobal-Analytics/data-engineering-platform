      label: MASTER_MENTOR
      selected_column: is_selected_mentor
    - key: pdb_mentee_form
      title: "Participant Database · mentee_registration_form"
      spreadsheet_id: 1W8VrZeyT1HKyZ1KQqI6tVOfw08WZ6-8zZ0eCO_eagFM
      tab: mentee_registration_form
      label: MASTER_MENTEE
      selected_column: is_selected_mentee
    - key: pdb_mentor_form
      title: "Participant Database · mentor_registration_form"
      spreadsheet_id: 1W8VrZeyT1HKyZ1KQqI6tVOfw08WZ6-8zZ0eCO_eagFM
